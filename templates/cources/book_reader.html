{% extends 'base.html' %}

{% block title %}Reading: {{ book.title }}{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row mb-3">
        <div class="col">
            <h1 class="h3">{{ book.title }}</h1>
            <div class="mb-2">
                <span class="badge bg-primary">Grade {{ book.grade }}</span>
                <span class="badge bg-info">{{ book.get_subject_display }}</span>
            </div>
        </div>
    </div>
    
    <div class="row">
        <div class="col">
            <div class="pdf-container" style="height: 85vh; padding: 1rem; background: #f5f5f5; border-radius: 4px;">
                <iframe 
                    src="{{ pdf_url }}"
                    style="width: 100%; height: 100%; border: 1px solid #ddd; border-radius: 4px; background: white;"
                    frameborder="0"
                    allowfullscreen
                ></iframe>
            </div>
        </div>
    </div>
</div>
{% endblock %}
